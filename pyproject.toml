[project]
name = "proto-pair"
version = "0.1.0"
description = "PROTO: VN30 proxy basket (HSX) vs VN30F1M (HNXDS) basis pair -- an execution-fidelity demonstrator"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=12.0",
    "duckdb>=1.0",
    "statsmodels>=0.14",
    "algotrade-plutus",   # editable install of the sibling plutus-simulator checkout
]

[project.scripts]
pp-extract = "proto_pair.experiments.extract:main"
pp-backtest = "proto_pair.backtest:main"
pp-credibility = "proto_pair.experiments.credibility_check:main"
pp-anchor = "proto_pair.experiments.pair_anchor:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proto_pair"]

[tool.pytest.ini_options]
testpaths = ["tests"]
